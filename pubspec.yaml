name: expense_tracker
description: "A production-quality Offline-First Personal Expense Manager built with Flutter, Drift, and Material 3."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  fl_chart: ^0.70.2

  # State Management
  provider: ^6.1.2

  # Encrypted Local Database
  drift: ^2.24.2
  sqlite3: ^2.4.6
  sqlcipher_flutter_libs: ^0.6.4
  path_provider: ^2.1.5
  path: ^1.9.0

  # Serialization & Core Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  csv: ^6.0.0
  crypto: ^3.0.6

  # Security & Authentication
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0

  # Cloud & Network
  supabase_flutter: ^2.8.3
  connectivity_plus: ^6.1.3

  # Local Notifications
  flutter_local_notifications: ^18.0.1
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
