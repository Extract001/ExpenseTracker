name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build_and_test:
    name: Lint, Test & Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display environment versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static analysis
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test --coverage

      - name: Configure CI Release Signing
        run: |
          CI_KEYSTORE_PATH="$GITHUB_WORKSPACE/android/ci-upload-keystore.jks"
          keytool -genkeypair -v \
            -keystore "$CI_KEYSTORE_PATH" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "ci_release_keystore_pass_123!" \
            -keypass "ci_release_keystore_pass_123!" \
            -dname "CN=ExpenseTracker CI, OU=CI, O=ExpenseTracker, L=Cloud, ST=Global, C=US" \
            -storetype PKCS12
          
          cat <<EOF > "$GITHUB_WORKSPACE/android/key.properties"
          storePassword=ci_release_keystore_pass_123!
          keyPassword=ci_release_keystore_pass_123!
          keyAlias=upload
          storeFile=ci-upload-keystore.jks
          EOF

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
